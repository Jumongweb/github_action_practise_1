name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t jumongweb/cloud_one:latest .

      - name: Push Docker image to Docker Hub
        run: docker push jumongweb/cloud_one:latest

      - name: Deploy to AWS EC2
        env:
          PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          INSTANCE_IP: ${{ secrets.PUBLIC_IPV4 }}
        run: |
          echo "$PRIVATE_KEY" > aws_key.pem
          chmod 600 aws_key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts
          ssh -i aws_key.pem ubuntu@$INSTANCE_IP << 'EOF'

          # Install Docker if not installed
          if ! command -v docker &> /dev/null; then
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi

          # Install PostgreSQL if not installed
          if ! command -v psql &> /dev/null; then
            sudo apt install -y postgresql postgresql-contrib
            sudo systemctl start postgresql
            sudo systemctl enable postgresql
          fi

          # Create a new database and user if they don’t exist
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'cloud_db'" | grep -q 1 || sudo -u postgres psql -c "CREATE DATABASE cloud_db;"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'dev_user'" | grep -q 1 || sudo -u postgres psql -c "CREATE USER dev_user WITH PASSWORD 'jumong';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cloud_db TO dev_user;"

          # Pull and run the Docker container
          sudo docker pull jumongweb/cloud_one:latest

          # Stop and remove any existing container with the same name
          if [ "$(docker ps -aq -f name=cloud_one)" ]; then
            sudo docker stop cloud_one
            sudo docker rm cloud_one
          fi

          # Run the container, passing database connection info as environment variables
          sudo docker run -d -p 3030:3030 --name cloud_one \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=cloud_db \
            -e DB_USER=dev_user \
            -e DB_PASSWORD=jumong \
            jumongweb/cloud_one:latest
          EOF
