name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t jumongweb/cloud_one:latest .

      - name: Push Docker image to Docker Hub
        run: docker push jumongweb/cloud_one:latest

      - name: Deploy to AWS EC2
        env:
          PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          INSTANCE_IP: ${{ secrets.PUBLIC_IPV4 }}
        run: |
          echo "$PRIVATE_KEY" > aws_key.pem
          chmod 600 aws_key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts
          ssh -i aws_key.pem ubuntu@$INSTANCE_IP << 'EOF'

          # Install Docker if not already installed
          if ! command -v docker &> /dev/null; then
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi

          # Create Docker network if it doesn't exist
          if ! docker network ls | grep -q cloud_network; then
            sudo docker network create cloud_network
          fi

          # Pull and run PostgreSQL container if not already running
          if [ "$(docker ps -aq -f name=cloud_db_postgres)" ]; then
            sudo docker start cloud_db_postgres
          else
            sudo docker run -d --name cloud_db_postgres \
              --network cloud_network \
              -e POSTGRES_DB=cloud_db \
              -e POSTGRES_USER=dev_user \
              -e POSTGRES_PASSWORD=jumong \
              -p 5432:5432 \
              postgres:latest
          fi

          # Stop and remove any existing application container
          if [ "$(docker ps -aq -f name=cloud_one)" ]; then
            sudo docker stop cloud_one
            sudo docker rm cloud_one
          fi

          # Pull the latest application image
          sudo docker pull jumongweb/cloud_one:latest

          # Run the application container, connecting to the PostgreSQL container
          sudo docker run -d -p 3030:3030 --name cloud_one \
            --network cloud_network \
            -e DB_HOST=cloud_db_postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=cloud_db \
            -e DB_USER=dev_user \
            -e DB_PASSWORD=jumong \
            jumongweb/cloud_one:latest
          EOF
