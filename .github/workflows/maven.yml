name: Deploy to Docker Hub and AWS

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Packages
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t jumongweb/cloud_one:latest .

      - name: Push Docker image to Docker Hub
        run: docker push jumongweb/cloud_one:latest

      - name: Deploy Docker Containers on AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PUBLIC_IPv4 }}      # Your AWS instance IP from secrets
#          username: ${{ secrets.AWS_USER }}     # SSH username from secrets
          key: ${{ secrets.RSA_PRIVATE_KEY }}   # SSH private key from secrets
          port: 22                              # SSH port (default 22)
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
            else
              echo "Docker is already installed."
            fi

            # Pull the latest Docker image for the app
            echo "Pulling latest Docker image..."
            sudo docker pull jumongweb/cloud_one:latest

            # Check if PostgreSQL container is running
            if ! sudo docker ps -q -f name=cloud-db; then
              echo "Starting new PostgreSQL container..."
              sudo docker run -d \
                --name cloud-db \
                -e POSTGRES_USER=myuser \
                -e POSTGRES_PASSWORD=mypassword \
                -e POSTGRES_DB=mydatabase \
                -p 5432:5432 \
                postgres:latest
            else
              echo "PostgreSQL container is already running."
            fi

            # Stop and remove the old application container if running
            if sudo docker ps -q -f name=cloud-one-container; then
              echo "Stopping and removing existing application container..."
              sudo docker stop cloud-one-container
              sudo docker rm cloud-one-container
            fi

            # Start the new application container connected to the PostgreSQL
            echo "Running the new application container..."
            sudo docker run -d \
              --name cloud-one-container \
              --link cloud-db:db \
              -p 3030:3030 \
              -e DB_HOST=db \
              -e DB_PORT=5432 \
              -e DB_USER=myuser \
              -e DB_PASSWORD=mypassword \
              -e DB_NAME=mydatabase \
              jumongweb/cloud_one:latest

            echo "Deployment complete. Listing running containers..."
            sudo docker ps
